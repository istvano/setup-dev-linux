# gitleaks configuration.
#
# The default rules are kept in full. One narrow exception is declared below:
# it silences a specific field in a specific file, not a rule and not a path.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = """
  Repository signing-key fingerprints are public by design. Each one is the
  fingerprint of a vendor's published GPG key, recorded so that a rotated or
  substituted key is refused at install time — see manifest/repositories.json
  and workstation/repository_keys.py. Publishing a fingerprint is how key
  pinning works; treating it as a credential inverts its purpose.
  """
  regexTarget = "line"
  paths = ['''manifest/repositories\.json''']
  regexes = ['''"key_fingerprint":\s*"[0-9A-F]{40}"''']
