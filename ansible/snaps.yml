---
- name: Install selected snaps
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    manifest: "{{ lookup('file', workstation_root ~ '/manifest/snaps.json') | from_json }}"
  tasks:
    # Only the snaps of the selected groups; the controller runs this playbook
    # only when the desktop set is selected.
    - name: Install each snap on its declared channel
      ansible.builtin.command:
        argv: [/usr/bin/snap, install, "{{ item.name }}", --channel, "{{ item.channel }}"]
      register: snap_install
      changed_when: "'already installed' not in snap_install.stderr"
      failed_when:
        - snap_install.rc != 0
        - "'already installed' not in snap_install.stderr"
      loop: "{{ manifest.snaps | selectattr('group', 'in', manifest_groups) | list }}"
      loop_control:
        label: "{{ item.name }}"
      become: true

    # Ubuntu seeds firefox and thunderbird on a release branch
    # (latest/stable/ubuntu-<release>), and `snap install` leaves a snap that is
    # already installed where it is, so the task above cannot move them.
    # `snap switch` changes only what the snap tracks: nothing downloads, it works
    # while the application is running, and the next refresh follows the declared
    # channel. Only a snap whose tracking differs is switched, so a re-run changes
    # nothing. `snap list` columns: Name Version Rev Tracking Publisher Notes.
    - name: Read what each installed snap tracks
      ansible.builtin.command:
        argv: [/usr/bin/snap, list]
      register: snap_list
      changed_when: false

    - name: Move a preinstalled snap onto its declared channel
      ansible.builtin.command:
        argv: [/usr/bin/snap, switch, --channel, "{{ item.channel }}", "{{ item.name }}"]
      when: >-
        snap_list.stdout is not search('(?m)^' ~ (item.name | regex_escape)
        ~ '\\s+\\S+\\s+\\S+\\s+' ~ (item.channel | regex_escape) ~ '\\s')
      loop: "{{ manifest.snaps | selectattr('group', 'in', manifest_groups) | list }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
