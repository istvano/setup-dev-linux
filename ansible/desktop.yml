---
- name: Apply the declared GNOME settings
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    # Runs as the target user: dconf settings are per-user, and applying them as
    # root would write them into root's database where the operator never sees
    # them. The worker reads every declared key back before reporting success.
    - name: Load and verify the declared settings
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - "{{ workstation_root }}/script/apply-desktop-settings"
      register: desktop_apply
      changed_when: (desktop_apply.stdout | from_json).changed

    # Ghostty reads one file and has no settings database, so its Solarized Light
    # configuration is a file rather than a dconf key. Replaced on each apply; a
    # different previous file is kept beside it with a timestamp (backup).
    - name: Create the Ghostty configuration directory
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/ghostty"
        state: directory
        mode: "0755"

    - name: Place the Ghostty configuration
      ansible.builtin.copy:
        src: "{{ workstation_root }}/manifest/files/ghostty/config"
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/ghostty/config"
        mode: "0644"
        backup: true
