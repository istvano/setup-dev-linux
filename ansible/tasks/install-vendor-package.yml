---
# One vendor-managed repository: install what it provides, then immediately hand
# the URI back. The handover cannot wait until all of them are done, because the
# source file this package drops breaks the very next apt call.
- name: "Install {{ vendor.id }} packages"
  ansible.builtin.command:
    argv: [/usr/bin/apt-get, install, -y, --no-install-recommends, "{{ item }}"]
  register: vendor_install
  changed_when: "'0 upgraded, 0 newly installed' not in vendor_install.stdout"
  loop: >-
    {{ selected | selectattr('source', 'equalto', vendor.id)
       | map(attribute='name') | list }}
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# Hand the URI back only to a source the vendor actually wrote. Vendors differ:
# claude-desktop's postinst registers its source only when no other source names
# the repository, so it steps aside while ours is present; google-chrome's
# registers once per machine (repo_add_once in /etc/default/google-chrome) and
# never again. Removing ours unconditionally left either package with no source
# at all, never updated and reported by verify as not from its declared source.
# When the vendor wrote nothing, ours stays and is the package's source; neither
# vendor adds one later while it exists, so the two never name the URI together.
# APT reads only *.list and *.sources, so a backup file is not a source.
- name: "Look for a source {{ vendor.id }} registered itself"
  ansible.builtin.command:
    argv: [/usr/bin/grep, -rlF, --, "{{ vendor.uri }}", /etc/apt/sources.list.d/]
  register: vendor_source
  changed_when: false
  failed_when: vendor_source.rc > 1

- name: "Hand {{ vendor.id }} back to the vendor package"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/workstation-{{ vendor.id }}.sources"
    state: absent
  when: >-
    vendor_source.stdout_lines
    | select('search', '\\.(list|sources)$')
    | reject('search', '/workstation-' ~ vendor.id ~ '\\.sources$')
    | list | length > 0
  become: true

# The vendor's package may have registered its own source during that
# install, which apt has no index for until the next refresh. Without it the
# package is installed but attributed to no repository, and verification
# rightly reports it as not coming from its declared source.
- name: "Refresh metadata after installing {{ vendor.id }}"
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: "Confirm the source list is readable after {{ vendor.id }}"
  ansible.builtin.command:
    argv: [/usr/bin/apt-get, check]
  changed_when: false
  become: true
