---
# One vendor-managed repository: install what it provides, then immediately hand
# the URI back. The handover cannot wait until all of them are done, because the
# source file this package drops breaks the very next apt call.
- name: "Install {{ vendor.id }} packages"
  ansible.builtin.command:
    argv: [/usr/bin/apt-get, install, -y, --no-install-recommends, "{{ item }}"]
  register: vendor_install
  changed_when: "'0 upgraded, 0 newly installed' not in vendor_install.stdout"
  loop: >-
    {{ selected | selectattr('source', 'equalto', vendor.id)
       | map(attribute='name') | list }}
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: "Hand {{ vendor.id }} back to the vendor package"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/workstation-{{ vendor.id }}.sources"
    state: absent
  become: true

# A vendor package may register its source only when no other source names
# the repository yet. claude-desktop's postinst does exactly that, and ours was
# still present while it ran, so it stepped aside; removing ours then left the
# package installed with no source at all, never updated and reported by verify
# as not from its declared source. With ours gone, run the package's configure
# step again so it registers its own, and stop if it still has none.
- name: "Look for the source {{ vendor.id }} registered"
  ansible.builtin.command:
    argv: [/usr/bin/grep, -rlF, --, "{{ vendor.uri }}", /etc/apt/sources.list.d/]
  register: vendor_source
  changed_when: false
  failed_when: vendor_source.rc > 1

- name: "Let {{ vendor.id }} register its own source"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/sbin/dpkg-reconfigure', '--frontend', 'noninteractive']
         + (selected | selectattr('source', 'equalto', vendor.id)
            | map(attribute='name') | list) }}
  when: vendor_source.rc == 1
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: "Confirm {{ vendor.id }} now has a source of its own"
  ansible.builtin.command:
    argv: [/usr/bin/grep, -rlF, --, "{{ vendor.uri }}", /etc/apt/sources.list.d/]
  register: vendor_source_after
  changed_when: false
  failed_when: vendor_source_after.rc != 0
  when: vendor_source.rc == 1

# The vendor's package may have registered its own source during that
# install, which apt has no index for until the next refresh. Without it the
# package is installed but attributed to no repository, and verification
# rightly reports it as not coming from its declared source.
- name: "Refresh metadata after {{ vendor.id }} registered its own source"
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: "Confirm the source list is readable after {{ vendor.id }}"
  ansible.builtin.command:
    argv: [/usr/bin/apt-get, check]
  changed_when: false
  become: true
