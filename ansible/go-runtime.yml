---
- name: Deliver the reviewed Go toolchain
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Verify and place the complete versioned Go payload
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - "{{ workstation_root }}/script/apply-go-runtime"
        stdin: "{{ {'config': workstation_config} | to_json }}"
      register: go_runtime_apply
      changed_when: >-
        go_runtime_apply.rc == 0 and
        (go_runtime_apply.stdout | from_json).changed
      no_log: true
