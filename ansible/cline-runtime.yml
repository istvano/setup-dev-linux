---
- name: Deliver the reviewed Cline CLI-only package closure
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Verify Node and place the complete versioned Cline CLI payload
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - "{{ workstation_root }}/script/apply-cline-runtime"
        stdin: "{{ {'config': workstation_config, 'selected': selected_runtimes} | to_json }}"
      register: cline_runtime_apply
      changed_when: >-
        cline_runtime_apply.rc == 0 and
        (cline_runtime_apply.stdout | from_json).changed
      no_log: true
